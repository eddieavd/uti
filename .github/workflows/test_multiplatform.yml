name: googletest

on: push

jobs:
  build:
    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        config:
        - {
            name: "macos clang-21 debug",
            os: macos-latest,
            build_type: "Debug",
            is_debug_build: "ON",
            is_release_build: "OFF",
            cc:  "/opt/homebrew/opt/llvm/bin/clang",
            cxx: "/opt/homebrew/opt/llvm/bin/clang",
            clang_version: 21,
            has_stl: "OFF"
          }
        - {
            name: "ubuntu clang-20 debug",
            os: ubuntu-latest,
            build_type: "Debug",
            is_debug_build: "ON",
            is_release_build: "OFF",
            cc: "clang-20",
            cxx: "clang++-20",
            clang_version: 20,
            has_stl: "OFF"
          }
#       - {
#           name: "ubuntu clang-20 release",
#           os: ubuntu-latest,
#           build_type: "Release",
#           is_debug_build: "OFF",
#           is_release_build: "ON",
#           cc: "clang-20",
#           cxx: "clang++-20",
#           clang_version: 20,
#           has_stl: "OFF"
#         }
    steps:
      - uses: actions/checkout@v4

      - name: install llvm + clang - macos

        if: startsWith( matrix.config.name, 'macos clang' )
        run: |
          /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
          brew install llvm

      - name: install llvm + clang - ubuntu

        if: startsWith( matrix.config.name, 'ubuntu clang' )
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh ${{ matrix.config.clang_version }} all

      - name: download ninja
        id: ninja
        shell: cmake -P {0}
        run: |
          set(ninja_version "1.11.1")

          if ("${{ runner.os }}" STREQUAL "Linux")
            set(ninja_suffix "linux.zip")
          elseif ("${{ runner.os }}" STREQUAL "macOS")
            set(ninja_suffix "mac.zip")
          endif()

          set(ninja_url "https://github.com/ninja-build/ninja/releases/download/v${ninja_version}/ninja-${ninja_suffix}")
          file(DOWNLOAD "${ninja_url}" ./ninja.zip SHOW_PROGRESS)
          execute_process(COMMAND ${CMAKE_COMMAND} -E tar xvf ./ninja.zip)

          execute_process(
            COMMAND chmod +x ninja
          )

      - name: install benchmark library

        run: |
          mkdir bench/lib
          cd bench/lib
          git clone https://github.com/google/benchmark.git
          cd benchmark
          mkdir build
          cd build
          cmake .. -DBENCHMARK_DOWNLOAD_DEPENDENCIES=ON -DCMAKE_BUILD_TYPE=Release -DBENCHMARK_ENABLE_TESTING=OFF -DBENCHMARK_ENABLE_GTEST_TESTS=OFF -DBENCHMARK_ENABLE_ASSEMBLY_TESTS=OFF
          sudo cmake --build . --config Release --target install

      - name: configure
        shell: cmake -P {0}
        run: |
          set( ENV{CC}  ${{ matrix.config.cc }} )
          set( ENV{CXX} ${{ matrix.config.cxx }} )

          set( HAS_LLVM ON )

          set( ENV{LLVM_DIR}  "/usr/lib/llvm-${{ matrix.config.clang_version }}/lib/cmake/llvm" )
          set( ENV{Clang_DIR} "/usr/lib/llvm-${{ matrix.config.clang_version }}/lib/cmake/clang" )

          file( TO_CMAKE_PATH "$ENV{GITHUB_WORKSPACE}/ninja" ninja_program )

          execute_process(
            COMMAND cmake
              -S .
              -B out
              -D CMAKE_BUILD_TYPE=${{ matrix.config.build_type }}
              -D CMAKE_EXPORT_COMPILE_COMMANDS=ON
              -G Ninja
              -D CMAKE_MAKE_PROGRAM=${ninja_program}
              -D UTI_DEBUG=${{ matrix.config.is_debug_build }}
              -D UTI_RELEASE=${{ matrix.config.is_release_build }}
              -D UTI_HAS_STL=${{ matrix.config.has_stl }}
              -D UTI_TEST=ON
            RESULT_VARIABLE result
          )
          if( NOT result EQUAL 0 )
            message( FATAL_ERROR "configure failed!" )
          endif()

      - name: build
        shell: cmake -P {0}
        run: |
          set( ENV{NINJA_STATUS} "[%f/%t %o/sec] " )

          execute_process(
            COMMAND cmake --build out -j 10
            RESULT_VARIABLE result
          )
          if( NOT result EQUAL 0 )
            message( FATAL_ERROR "build failed!" )
          endif()

      - name: run tests
        shell: cmake -P {0}
        run: |
          execute_process(
            COMMAND ./test/uti/core/uti.core.test --verbosity high
            WORKING_DIRECTORY out
            RESULT_VARIABLE result
          )
          if( NOT result EQUAL 0 )
            message( FATAL_ERROR "tests failed!" )
          endif()
